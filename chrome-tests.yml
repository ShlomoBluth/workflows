name: Chrome tests

on:
  schedule:
    - cron: '0 6,14,22 * * *'
  workflow_dispatch: # allow manual runs from the Actions tab

concurrency:
  group: chrome-tests
  cancel-in-progress: false

permissions:
  contents: write # the called workflow deploys the report to gh-pages

jobs:
  cypress:
    uses: ShlomoBluth/workflows/.github/workflows/cypress-tests.yml@v1
    with:
      browser: chrome
    secrets: inherit
