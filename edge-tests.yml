name: Edge tests

on:
  schedule:
    - cron: '0 4,12,20 * * *'
  workflow_dispatch: # allow manual runs from the Actions tab

concurrency:
  group: edge-tests
  cancel-in-progress: false

permissions:
  contents: write # the called workflow deploys the report to gh-pages

jobs:
  cypress:
    uses: ShlomoBluth/workflows/.github/workflows/cypress-tests.yml@v1
    with:
      browser: edge
    secrets: inherit
