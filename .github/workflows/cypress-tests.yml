name: Cypress tests (reusable)

# Shared Cypress job for all dicta-* test repos.
# Called from each repo's chrome-tests.yml / edge-tests.yml / firefox-tests.yml (templates in this repo's root).
# Which specs run is set by the tool-tests / requests-tests inputs. Callers that don't pass them
# fall back to TOOL_TESTS / REQUESTS_TESTS in the calling repo's cypress.config.js.

on:
  workflow_call:
    inputs:
      browser:
        description: chrome | edge | firefox
        required: true
        type: string
      image:
        description: cypress/browsers image. Firefox >= 135 needs Cypress >= 14.1 in the calling repo.
        required: false
        type: string
        default: cypress/browsers:node-24.21.0-chrome-154.0.8037.92-1-ff-157.0-edge-154.0.4258.48-1
      tool-tests:
        description: "'true' runs toolTests. Empty = read TOOL_TESTS from cypress.config.js"
        required: false
        type: string
        default: ''
      requests-tests:
        description: "'true' runs requestsTests. Empty = read REQUESTS_TESTS from cypress.config.js"
        required: false
        type: string
        default: ''

permissions:
  contents: write # needed to push the report to gh-pages

defaults:
  run:
    shell: bash # bash with -eo pipefail, so `cypress | tee` keeps the cypress exit code

jobs:
  cypress-e2e:
    name: Run on ${{ inputs.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    container:
      image: ${{ inputs.image }}
      options: --user 1001 # Firefox refuses to run as root

    env:
      BROWSER: ${{ inputs.browser }}
      # failed tests in the report link here; their videos are a 7-day artifact of this run
      CYPRESS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # npm ci from the lockfile (the Cypress version in package.json) with npm + Cypress binary caching
      - name: Install dependencies
        uses: cypress-io/github-action@v7
        with:
          runTests: false

      - name: Decide which specs run
        env:
          TOOL_INPUT: ${{ inputs.tool-tests }}
          REQUESTS_INPUT: ${{ inputs.requests-tests }}
        run: |
          fromConfig() { node -p "String((require('./cypress.config.js').env || {}).$1 ?? false)"; }
          echo "TOOL_TESTS=${TOOL_INPUT:-$(fromConfig TOOL_TESTS)}" >> "$GITHUB_ENV"
          echo "REQUESTS_TESTS=${REQUESTS_INPUT:-$(fromConfig REQUESTS_TESTS)}" >> "$GITHUB_ENV"
          # stale results committed to the repo must not end up in this run's report
          rm -rf cypress/results cypress/videos

      - name: Write spec runner
        run: |
          cat > "$RUNNER_TEMP/run-spec.sh" <<'EOF'
          #!/usr/bin/env bash
          # Runs one spec; retries once if it failed for a known infrastructure reason.
          set -o pipefail
          spec="$1"
          log="$RUNNER_TEMP/$(basename "${spec%%{*}").log"
          transient='Error: ffmpeg exited|Because this error occurred during a `before each` hook|EISDIR: illegal operation on a directory, read|`cy.visit\(\)` failed trying to load'
          for attempt in 1 2; do
            before=$(ls cypress/results/json 2>/dev/null)
            npx cypress run --browser "$BROWSER" --spec "$spec" --config trashAssetsBeforeRuns=false 2>&1 | tee "$log" && exit 0
            if [ "$attempt" = 2 ] || ! grep -qE "$transient" "$log"; then exit 1; fi
            echo "::warning::$spec hit a known transient failure, retrying once"
            # drop the failed attempt's report so it isn't merged next to the retry
            for f in $(ls cypress/results/json 2>/dev/null); do
              grep -qxF "$f" <<<"$before" || rm -f "cypress/results/json/$f"
            done
          done
          EOF
          chmod +x "$RUNNER_TEMP/run-spec.sh"

      - name: Run ${{ inputs.browser }} tool tests
        if: env.TOOL_TESTS == 'true'
        run: $RUNNER_TEMP/run-spec.sh 'cypress/e2e/toolTests{,.cy}.js'

      - name: Run ${{ inputs.browser }} requests tests
        if: always() && env.REQUESTS_TESTS == 'true'
        run: $RUNNER_TEMP/run-spec.sh 'cypress/e2e/requestsTests{,.cy}.js'

      - name: Build HTML report
        if: always() && (env.TOOL_TESTS == 'true' || env.REQUESTS_TESTS == 'true')
        run: |
          npx mochawesome-merge "cypress/results/json/*.json" > index.json
          npx marge index.json --reportDir public --assetsDir public/assets \
            --reportPageTitle "abbreviation - ${{ inputs.browser }}"

      # only failed specs keep a video (dicta-shared/videoCleanup.js); GitHub deletes them after 7 days.
      # Videos are not deployed to gh-pages, so they don't pile up in its history.
      - name: Upload videos of failed specs
        if: always() && hashFiles('cypress/videos/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: failed-videos-${{ inputs.browser }}
          path: cypress/videos
          retention-days: 7

      - name: Deploy report page
        if: always() && (env.TOOL_TESTS == 'true' || env.REQUESTS_TESTS == 'true')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          # one folder per browser so the three workflows don't overwrite each other's report
          destination_dir: ${{ inputs.browser }}
