name: Firefox tests

on:
  schedule:
    - cron: '0 2,10,18 * * *'
  workflow_dispatch: # allow manual runs from the Actions tab

concurrency:
  group: firefox-tests
  cancel-in-progress: false

permissions:
  contents: write # the called workflow deploys the report to gh-pages

jobs:
  cypress:
    uses: ShlomoBluth/workflows/.github/workflows/cypress-tests.yml@v1
    with:
      browser: firefox
    secrets: inherit
